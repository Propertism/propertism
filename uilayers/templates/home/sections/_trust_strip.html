<section id="stats-section" class="trust-strip-section compact">
    <div class="container">
        <div class="trust-strip-metrics">
            {% for stat in stats %}
            <div class="metric-item">
                <span class="metric-value">{{ stat.value }}</span>
                <span class="metric-label">{{ stat.label }}</span>
            </div>
            {% empty %}
            <!-- Fallback if stats are not loaded yet -->
            <div class="metric-item">
                <span class="metric-value">10+</span>
                <span class="metric-label">Years Experience</span>
            </div>
            <div class="metric-item">
                <span class="metric-value">100+</span>
                <span class="metric-label">NRI Clients</span>
            </div>
            <div class="metric-item">
                <span class="metric-value">500+</span>
                <span class="metric-label">Properties Managed</span>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
