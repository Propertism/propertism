<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propertism WhatsApp Draft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .card {
            width: 1200px;
            height: 630px;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            background: #0a122c;
        }

        .card-bg {
            position: absolute;
            inset: 0;
            background-image: url('media/hero/8k_resolution_ultra_high_definition_cinematic_shot_of_chennai_s_modern_skyline.png');
            background-size: cover;
            background-position: center 34%;
            transform: scale(1.02);
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, rgba(7, 12, 28, 0.72) 0%, rgba(7, 12, 28, 0.34) 42%, rgba(7, 12, 28, 0.08) 72%, rgba(7, 12, 28, 0.04) 100%),
                linear-gradient(180deg, rgba(6, 10, 24, 0.16) 0%, rgba(6, 10, 24, 0.02) 30%, rgba(6, 10, 24, 0.36) 100%);
        }

        .card-content {
            position: absolute;
            inset: 0;
            padding: 38px 46px 36px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 16px;
            max-width: 420px;
        }

        .logo-svg {
            height: 54px;
            width: auto;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.45));
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .brand-name {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.17em;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.42);
        }

        .headline-block {
            max-width: 760px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: -8px;
        }

        .headline {
            font-family: 'Cinzel', serif;
            font-size: 84px;
            font-weight: 600;
            line-height: 0.97;
            letter-spacing: -0.02em;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0,0,0,0.58);
        }

        .headline-gold {
            display: block;
            color: #e4c36a;
            text-shadow:
                0 2px 12px rgba(255,255,255,0.12),
                0 0 24px rgba(228,195,106,0.28),
                0 4px 18px rgba(0,0,0,0.48);
        }

        .tagline {
            max-width: 620px;
            font-size: 34px;
            font-weight: 800;
            line-height: 1.15;
            color: #ffffff;
            text-shadow: 0 2px 12px rgba(0,0,0,0.75);
        }

        .proof-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .proof-pill {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 12px 18px 14px;
            background: rgba(8, 12, 30, 0.54);
            border: 1px solid rgba(228,195,106,0.18);
            backdrop-filter: blur(5px);
            box-shadow: 0 10px 24px rgba(0,0,0,0.18);
        }

        .proof-value {
            font-size: 44px;
            font-weight: 800;
            line-height: 1;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.52);
        }

        .proof-label {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #e4c36a;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-bg"></div>
        <div class="card-overlay"></div>

        <div class="card-content">
            <div class="brand-row">
                <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15,35 L62,17 L63,12 L70,14 L69,20 L92,27 L91,33 L18,41 Z" fill="#cda26b"/>
                    <path d="M22,43 L40,40 L40,84 L22,91 Z" fill="#cda26b"/>
                    <path d="M40,40 L74,35 L74,77 L40,84 Z" fill="#bfa173" opacity="0.85"/>
                    <path d="M40,40 L40,84 M40,46 C59,44 61,61 40,64" stroke="#0a122c" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
                    <path d="M34,44 L34,84" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
                </svg>
                <div class="brand-text">
                    <span class="brand-name">PROPERTISM</span>
                </div>
            </div>

            <div class="headline-block">
                <h1 class="headline">
                    NRI Realty Advisory
                    <span class="headline-gold">Redefined.</span>
                </h1>
                <p class="tagline">Manage Chennai property from anywhere.</p>
            </div>

            <div class="proof-row">
                <div class="proof-pill">
                    <span class="proof-value">50+</span>
                    <span class="proof-label">Properties</span>
                </div>
                <div class="proof-pill">
                    <span class="proof-value">100+</span>
                    <span class="proof-label">NRI Clients</span>
                </div>
                <div class="proof-pill">
                    <span class="proof-value">10+ Yrs</span>
                    <span class="proof-label">Built Trust</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
