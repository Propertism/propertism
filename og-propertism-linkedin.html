<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propertism LinkedIn Organic Draft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111827;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .card {
            width: 1200px;
            height: 630px;
            position: relative;
            overflow: hidden;
            background: #091224;
        }

        .card-bg {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, rgba(7, 12, 28, 0.88) 0%, rgba(7, 12, 28, 0.80) 22%, rgba(7, 12, 28, 0.44) 48%, rgba(7, 12, 28, 0.08) 72%, rgba(7, 12, 28, 0.02) 100%),
                linear-gradient(180deg, rgba(8, 14, 28, 0.26) 0%, rgba(8, 14, 28, 0.06) 28%, rgba(8, 14, 28, 0.26) 100%),
                url('media/hero/8k_resolution_ultra_high_definition_cinematic_shot_of_chennai_s_modern_skyline.png') center 34% / cover no-repeat;
            transform: scale(1.02);
        }

        .gold-rail {
            position: absolute;
            inset: 34px auto 34px 34px;
            width: 8px;
            border-radius: 999px;
            background: linear-gradient(180deg, #f0d58c 0%, #b89a4a 100%);
            box-shadow: 0 0 24px rgba(184, 154, 74, 0.24);
        }

        .content {
            position: absolute;
            inset: 0;
            padding: 36px 42px;
        }

        .panel {
            width: 560px;
            height: 558px;
            padding: 26px 28px 28px 34px;
            margin-left: 18px;
            background: linear-gradient(180deg, rgba(8, 14, 28, 0.76) 0%, rgba(8, 14, 28, 0.64) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.24);
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-svg {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
        }

        .brand-name {
            color: #ffffff;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.16em;
        }

        .eyebrow {
            margin-top: 22px;
            color: #e4c36a;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .headline {
            margin-top: 16px;
            color: #ffffff;
            font-size: 72px;
            line-height: 0.94;
            font-weight: 800;
            letter-spacing: -0.05em;
            text-transform: uppercase;
        }

        .headline-accent {
            color: #e4c36a;
        }

        .subcopy {
            margin-top: 22px;
            max-width: 430px;
            color: #f8fafc;
            font-size: 30px;
            line-height: 1.16;
            font-weight: 700;
        }

        .footer-row {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 12px 16px;
            border: 1px solid rgba(228, 195, 106, 0.26);
            background: rgba(11, 18, 36, 0.7);
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            line-height: 1;
        }

        .badge-accent {
            color: #e4c36a;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-bg"></div>
        <div class="gold-rail"></div>

        <div class="content">
            <div class="panel">
                <div>
                    <div class="brand-row">
                        <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M15,35 L62,17 L63,12 L70,14 L69,20 L92,27 L91,33 L18,41 Z" fill="#cda26b"/>
                            <path d="M22,43 L40,40 L40,84 L22,91 Z" fill="#cda26b"/>
                            <path d="M40,40 L74,35 L74,77 L40,84 Z" fill="#bfa173" opacity="0.85"/>
                            <path d="M40,40 L40,84 M40,46 C59,44 61,61 40,64" stroke="#0a122c" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
                            <path d="M34,44 L34,84" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
                        </svg>
                        <div class="brand-name">PROPERTISM</div>
                    </div>

                    <div class="eyebrow">Chennai For NRIs</div>

                    <h1 class="headline">
                        Buy. Sell.<br>
                        <span class="headline-accent">Manage.</span>
                    </h1>

                    <p class="subcopy">Property services built for overseas owners who need on-ground execution in Chennai.</p>
                </div>

                <div class="footer-row">
                    <div class="badge">Local <span class="badge-accent">&nbsp;field team</span></div>
                    <div class="badge">NRI <span class="badge-accent">&nbsp;focused</span></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
