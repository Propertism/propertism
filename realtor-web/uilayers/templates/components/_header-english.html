                <!-- Mobile Menu Toggle Button -->
                <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu" aria-expanded="false">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Mobile Navigation Menu -->
    <nav class="mobile-nav" id="mobileNav">
        <div class="mobile-nav-header">PROPERTISM</div>
        <div class="mobile-nav-content">
            <a href="{{ home_section_links.home }}" class="mobile-menu-item">Home</a>
            <a href="{{ home_section_links.services }}" class="mobile-menu-item">Services</a>
            <a href="{{ home_section_links.properties }}" class="mobile-menu-item">Properties</a>
            <a href="{{ home_section_links.about }}" class="mobile-menu-item">About</a>
            <a href="{{ home_section_links.management }}" class="mobile-menu-item">Management</a>
            <a href="{{ home_section_links.reviews }}" class="mobile-menu-item">Reviews</a>
            <a href="{{ home_section_links.blog }}" class="mobile-menu-item">Blog</a>
            <a href="{{ home_section_links.contact }}" class="mobile-menu-item mobile-menu-item-cta">Quote</a>
        </div>
    </nav>
    
    <!-- Mobile Menu Backdrop -->
    <div class="mobile-menu-backdrop" id="mobileMenuBackdrop"></div>
</header>

<script>
// Mobile Menu Toggle
(function() {
    const menuToggle = document.getElementById('mobileMenuToggle');
    const mobileNav = document.getElementById('mobileNav');
    const backdrop = document.getElementById('mobileMenuBackdrop');
    
    if (menuToggle && mobileNav && backdrop) {
        menuToggle.addEventListener('click', function() {
            const isOpen = mobileNav.classList.contains('active');
            
            if (isOpen) {
                closeMenu();
            } else {
                openMenu();
            }
        });
        
        backdrop.addEventListener('click', closeMenu);
        
        // Close menu when clicking on a link
        const menuItems = mobileNav.querySelectorAll('.mobile-menu-item');
        menuItems.forEach(item => {
            item.addEventListener('click', closeMenu);
        });
        
        // Close menu on escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && mobileNav.classList.contains('active')) {
                closeMenu();
            }
        });
        
        function openMenu() {
            mobileNav.classList.add('active');
            backdrop.classList.add('active');
            menuToggle.classList.add('active');
            menuToggle.setAttribute('aria-expanded', 'true');
            document.body.classList.add('mobile-menu-open');
            document.body.style.overflow = 'hidden';
        }
        
        function closeMenu() {
            mobileNav.classList.remove('active');
            backdrop.classList.remove('active');
            menuToggle.classList.remove('active');
            menuToggle.setAttribute('aria-expanded', 'false');
            document.body.classList.remove('mobile-menu-open');
            document.body.style.overflow = '';
        }
    }
})();
</script>
