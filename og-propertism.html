<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propertism.in OG Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .card {
            width: 1200px;
            height: 630px;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* Full-bleed background photo */
        .card-bg {
            position: absolute;
            inset: 0;
            background-image: url('media/hero/8k_resolution_ultra_high_definition_cinematic_shot_of_chennai_s_modern_skyline.png');
            background-size: cover;
            background-position: center 30%;
            filter: none;
        }

        /* Multi-layer overlay: navy vignette + bottom warm fade */
        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(8, 12, 30, 0.10) 0%,
                rgba(8, 12, 30, 0.04) 45%,
                rgba(8, 12, 30, 0.00) 72%,
                rgba(8, 12, 30, 0.08) 100%
            );
        }

        /* Left-side text scrim to keep the copy readable */
        .card-overlay-left {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to right,
                rgba(8, 12, 30, 0.40) 0%,
                rgba(8, 12, 30, 0.14) 48%,
                transparent 75%
            );
        }

        /* Bottom gold gradient strip */
        .card-overlay-bottom {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(160, 118, 40, 0.12) 0%,
                rgba(160, 118, 40, 0.04) 18%,
                transparent 35%
            );
        }

        /* Content layer */
        .card-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 34px 52px 32px;
        }

        /* Top bar */
        .top-bar {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
        }

        .logo-block {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-svg { height: 66px; width: auto; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5)); }

        .logo-text { display: flex; flex-direction: column; gap: 3px; }

        .logo-name {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 0.18em;
            color: #FFFFFF;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .logo-sub {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 32px;
            letter-spacing: 0.04em;
            color: #e8b82a;
            font-weight: 700;
            line-height: 1;
            text-transform: uppercase;
            text-shadow: 0 1px 6px rgba(0,0,0,0.7);
        }

        /* Center headline */
        .headline-block {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .headline {
            font-family: 'Cinzel', serif;
            font-size: 76px;
            font-weight: 600;
            line-height: 1.05;
            color: #FFFFFF;
            letter-spacing: -0.01em;
            text-shadow: 0 4px 24px rgba(0,0,0,0.55);
        }

        .headline-gold {
            color: #E4C36A;
            display: block;
            filter: brightness(1.1) saturate(1.08);
            text-shadow:
                0 2px 10px rgba(255,255,255,0.15),
                0 0 28px rgba(228,195,106,0.45),
                0 4px 20px rgba(0,0,0,0.5);
        }

        .tagline {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 28px;
            font-style: normal;
            font-weight: 700;
            color: #FFFFFF;
            line-height: 1.34;
            letter-spacing: 0.01em;
            max-width: 880px;
            text-shadow:
                0 2px 12px rgba(0,0,0,0.80),
                0 0 30px rgba(0,0,0,0.40);
        }

        /* Bottom bar */
        .bottom-bar {
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            gap: 44px;
        }

        .stats-strip {
            display: flex;
            align-items: center;
            gap: 46px;
        }

        .stat-item { display: flex; flex-direction: column; gap: 4px; }

        .stat-number {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 50px;
            font-weight: 700;
            color: #FFFFFF;
            line-height: 1;
            text-shadow: 0 2px 12px rgba(0,0,0,0.6);
        }

        .stat-label {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            letter-spacing: 0.14em;
            color: rgba(255,255,255,0.88);
            text-transform: uppercase;
            text-shadow: 0 1px 6px rgba(0,0,0,0.65);
        }

        .stat-divider {
            width: 1px;
            height: 48px;
            background: rgba(196,156,82,0.4);
        }

        .bottom-right {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            padding-bottom: 0;
        }

        .phone {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: 0.04em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.65);
        }

        .domain {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.16em;
            color: #C49C52;
            text-transform: uppercase;
        }

        /* Gold bottom rule */
        .gold-rule {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(to right, transparent 0%, #C49C52 30%, #E4C36A 50%, #C49C52 70%, transparent 100%);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-bg"></div>
        <div class="card-overlay"></div>
        <div class="card-overlay-left"></div>
        <div class="card-overlay-bottom"></div>

        <div class="card-content">

            <!-- TOP -->
            <div class="top-bar">
                <div class="logo-block">
                    <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15,35 L62,17 L63,12 L70,14 L69,20 L92,27 L91,33 L18,41 Z" fill="#cda26b"/>
                        <path d="M22,43 L40,40 L40,84 L22,91 Z" fill="#cda26b"/>
                        <path d="M40,40 L74,35 L74,77 L40,84 Z" fill="#bfa173" opacity="0.85"/>
                        <path d="M40,40 L40,84 M40,46 C59,44 61,61 40,64" stroke="#0a122c" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
                        <path d="M34,44 L34,84" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
                    </svg>
                    <div class="logo-text">
                        <span class="logo-name">PROPERTISM</span>
                        <span class="logo-sub">NRI Property Management &middot; Chennai</span>
                    </div>
                </div>
            </div>

            <!-- CENTRE -->
            <div class="headline-block">
                <h1 class="headline">
                    NRI Realty Advisory
                    <span class="headline-gold">Redefined.</span>
                </h1>
                <p class="tagline">Buy, sell, rent, and manage Chennai property from anywhere.</p>
            </div>

            <!-- BOTTOM -->
            <div class="bottom-bar">
                <div class="stats-strip">
                    <div class="stat-item">
                        <span class="stat-number">50+</span>
                        <span class="stat-label">Properties</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item">
                        <span class="stat-number">100+</span>
                        <span class="stat-label">NRI Clients</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item">
                        <span class="stat-number">10+ Yrs</span>
                        <span class="stat-label">Built Trust</span>
                    </div>
                </div>
                <div class="bottom-right">
                    <span class="phone">+91 86670 20798</span>
                    <span class="domain">propertism.in</span>
                </div>
            </div>

        </div>

        <div class="gold-rule"></div>
    </div>
</body>
</html>
