{% load static %}
<!-- MID-PAGE QUICK ENQUIRY FORM -->
<style>
    #mid-page-lead-section .hf-field-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-bottom: 36px !important;
    }

    #mid-page-lead-section .intent-radios {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    #mid-page-lead-section .captcha-cta-row {
        display: flex;
        align-items: center;
        gap: 32px;
        margin-top: 24px;
    }

    #mid-page-lead-section .recaptcha-container {
        margin: 0 !important;
    }

    @media (max-width: 768px) {
        #mid-page-lead-section .hf-field-row {
            grid-template-columns: 1fr !important;
            gap: 12px !important;
        }

        #mid-page-lead-section .intent-radios {
            grid-template-columns: 1fr !important;
            gap: 12px !important;
        }

        #mid-page-lead-section .captcha-cta-row {
            flex-direction: column !important;
            align-items: center !important;
            gap: 16px !important;
        }

        #mid-page-lead-section .hf-submit-btn {
            max-width: 100% !important;
            margin: 0 auto !important;
        }
    }
</style>

<section id="mid-page-lead-section" class="section-full"
    style="background-color: var(--brand-navy) !important; padding: 40px 0 !important; border-top: 1px solid var(--border-subtle) !important;">
    <div class="container" style="max-width: 900px !important; margin: 0 auto !important; padding: 0 24px !important;">
        <div class="hf-form-card"
            style="border: 1px solid rgba(196, 156, 82, 0.2) !important; padding: 32px !important; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4) !important;">
            <span class="section-kicker"
                style="color: var(--brand-gold) !important; font-size: 0.75rem !important; font-weight: 700 !important; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 8px !important; display: block;">
                Quick Enquiry
            </span>
            <h2 class="section-title"
                style="font-family: var(--serif-main) !important; font-size: clamp(1.6rem, 3vw, 2.2rem) !important; font-weight: 500 !important; line-height: 1.1 !important; color: #FFFFFF !important; margin-bottom: 24px !important;">
                Tell us about your property

                            <input type="radio" name="intent_radio" value="industrial" {% if intent_radio_val == "industrial" or not intent_radio_val %}checked{% endif %}
                                style="accent-color: var(--brand-gold); width: 16px; height: 16px;" />
                            <span>Manage my property</span>
                        </label>
                    </div>
                </div>

                <div class="captcha-cta-row">
                    {% include 'includes/_form_validation_fields_captcha.html' %}
                    <button type="submit" class="hf-submit-btn" style="height: 78px !important; font-size: 1.1rem !important; font-weight: 700 !important; letter-spacing: 0.05em !important; flex: 1 !important; margin: 0 !important; display: flex !important; align-items: center; justify-content: center; text-transform: uppercase;">
                        Request Callback
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        function handleFocus() {
            const hash = window.location.hash;
            if (hash === '#mid-page-lead-section') {
                const nameInput = document.querySelector('#propertism-mid-page-form input[name="name"]');
                if (nameInput) setTimeout(() => nameInput.focus(), 500);
            } else if (hash === '#contact' || hash === '#contact-section') {
                const contactInput = document.querySelector('#propertism-hf-form input[name="name"]');
                if (contactInput) setTimeout(() => contactInput.focus(), 500);
            }
        }
        window.addEventListener("hashchange", handleFocus);
        handleFocus();



        const midForm = document.getElementById('propertism-mid-page-form');
        if (midForm) {
            midForm.addEventListener('submit', function (e) {
                const name = this.querySelector('input[name="name"]').value;
                const phoneInput = this.querySelector('input[name="phone"]');
                const countrySelect = this.querySelector('select[name="country_code"]');
                const countryCode = countrySelect.value;
                const countryName = countrySelect.options[countrySelect.selectedIndex].text.split('(')[0].trim();

                // Prepend country code to phone number before submitting
                let rawPhone = phoneInput.value;
                if (!rawPhone.startsWith('+')) {
                    phoneInput.value = countryCode + " " + rawPhone;
                }

                const intentRadio = this.querySelector('input[name="intent_radio"]:checked');

                if (!intentRadio) {
                    e.preventDefault();
                    alert('Please select what you want to do with your property.');
                    return;
                }

                const intentValue = intentRadio.value;
                const intentLabel = intentRadio.nextElementSibling.textContent;

                // Set the hidden service input to map directly to model SERVICE_CHOICES
                document.getElementById('mid-page-service-hidden').value = intentValue;

                // Populate the hidden message field with country and selected intent
                const messageContent = `Country of Residence: ${countryName} (${countryCode})\nSelected Intent: ${intentLabel}\nSubmitted via homepage mid-page callback form.`;
                document.getElementById('mid-page-message-hidden').value = messageContent;
            });

            // Helper function to scroll with sticky header offset
            const scrollToElementWithOffset = (elementId) => {
                const target = document.getElementById(elementId);
                if (!target) return;

                const nav = document.querySelector('.v4-nav-wrapper') ||
                    document.querySelector('header') ||
                    document.querySelector('.v4-nav') ||
                    document.querySelector('.site-header');
                const navHeight = nav ? nav.offsetHeight : 92;

                const elementPosition = target.getBoundingClientRect().top;
                const offsetPosition = elementPosition + (window.scrollY || window.pageYOffset) - navHeight;

                window.scrollTo({
                    top: offsetPosition,
                    behavior: 'smooth'
                });
            };

            // Handle clicks on any link with data-select-intent attribute
            document.querySelectorAll('a[data-select-intent]').forEach(link => {
                link.addEventListener('click', function (e) {
                    const intentValue = this.getAttribute('data-select-intent');
                    if (intentValue) {
                        const targetRadio = midForm.querySelector(`input[name="intent_radio"][value="${intentValue}"]`);
                        if (targetRadio) {
                            targetRadio.checked = true;
                        }

                        e.preventDefault();
                        scrollToElementWithOffset('mid-page-lead-section');
                        history.pushState(null, null, '#mid-page-lead-section');
                        setTimeout(() => {
                            const nameInput = document.querySelector('#propertism-mid-page-form input[name="name"]');
                            if (nameInput) nameInput.focus();
                        }, 600);
                    }
                });
            });

            // Handle intent query parameter or hash on page load
            const checkUrlIntent = () => {
                const urlParams = new URLSearchParams(window.location.search);
                let intentValue = urlParams.get('intent');

                // Also check if it's in the hash format: #mid-page-lead-section?intent=xyz
                if (!intentValue && window.location.hash.includes('?intent=')) {
                    const hashParts = window.location.hash.split('?intent=');
                    intentValue = hashParts[1];
                }

                if (intentValue) {
                    const targetRadio = midForm.querySelector(`input[name="intent_radio"][value="${intentValue}"]`);
                    if (targetRadio) {
                        targetRadio.checked = true;
                        setTimeout(() => {
                            scrollToElementWithOffset('mid-page-lead-section');
                            setTimeout(() => {
                                const nameInput = document.querySelector('#propertism-mid-page-form input[name="name"]');
                                if (nameInput) nameInput.focus();
                            }, 300);
                        }, 300);
                    }
                }
            };

            checkUrlIntent();
            window.addEventListener('hashchange', checkUrlIntent);
        }
    });
</script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var el = document.querySelector('select[name="country_code"]');
        if (el) {
            var control = new TomSelect(el, {
                create: false,
                dropdownParent: "body",
                sortField: { field: "text", direction: "asc" },
                render: {
                    option: function (data, escape) {
                        var iso = data.$option.getAttribute('data-iso');
                        var flagHtml = iso ? '<img src="https://flagcdn.com/w20/' + escape(iso) + '.png" style="width:20px; margin-right:8px; vertical-align:middle;">' : '';
                        return '<div>' + flagHtml + escape(data.text) + '</div>';
                    },
                    item: function (data, escape) {
                        var iso = data.$option.getAttribute('data-iso');
                        var flagHtml = iso ? '<img src="https://flagcdn.com/w20/' + escape(iso) + '.png" style="width:20px; margin-right:8px; vertical-align:middle;">' : '';
                        return '<div>' + flagHtml + escape(data.text) + '</div>';
                    }
                }
            });
            {% if prefilled_country_code %}
            control.setValue("{{ prefilled_country_code }}");
            {% endif %}
        }
    });
</script>
