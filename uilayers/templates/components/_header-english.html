{% load static %}
<header class="site-header" id="site-header">
    <div class="container">
        <div class="header-content">
            <a href="{{ home_section_links.home }}" class="logo">
                <!-- Dark Mode Logo (Default Dynamic) -->
                <img src="{{ company.logo.url }}" alt="Propertism" class="logo-image logo-dark">
                <!-- Light Mode Logo (Gold + Dark Text) -->
                <img src="{% static 'images/propertism-logo-tm.png' %}" alt="Propertism" class="logo-image logo-light">
            </a>
            
            <!-- Desktop Navigation -->
            <nav class="main-nav main-nav-even">
                <a href="{{ home_section_links.home }}">Home</a>
                <a href="/#services-section">Services</a>
                <a href="/#properties-section">Properties</a>
                <a href="/#management-section">Management</a>
                <a href="/#reviews-section">Reviews</a>
                <a href="/#blog-section">Insights</a>
                <a href="/#about-section">About</a>
                <a href="/#contact-section" class="nav-cta">Contact</a>
            </nav>
            
            <div class="header-actions">
                <!-- V4 Tools: Theme & Typography -->
                <div class="header-v4-tools">
                    <button class="v4-tool-btn" id="themeToggle" title="Toggle Theme">
                        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    </button>
                    <button class="v4-tool-btn" id="typoToggle" title="Switch Typography Profile">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                        <span id="typoLabel" class="v4-sub-label">m</span>
                    </button>
                </div>

                <!-- Mobile Menu Toggle Button -->
                <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu" aria-expanded="false">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Mobile Navigation Menu -->
    <nav class="mobile-nav" id="mobileNav">
        <div class="mobile-nav-header">PROPERTISM</div>
        <div class="mobile-nav-content">
            <a href="{{ home_section_links.home }}" class="mobile-menu-item">Home</a>
            <a href="/#services-section" class="mobile-menu-item">Services</a>
            <a href="/#properties-section" class="mobile-menu-item">Properties</a>
            <a href="/#management-section" class="mobile-menu-item">Management</a>
            <a href="/#reviews-section" class="mobile-menu-item">Reviews</a>
            <a href="/#blog-section" class="mobile-menu-item">Insights</a>
            <a href="/#about-section" class="mobile-menu-item">About</a>
            <a href="/#contact-section" class="mobile-menu-item mobile-nav-cta">Contact</a>
        </div>
    </nav>
    
    <!-- Mobile Menu Backdrop -->
    <div class="mobile-menu-backdrop" id="mobileMenuBackdrop"></div>
</header>

<script>
// Mobile Menu Toggle
(function() {
    const menuToggle = document.getElementById('mobileMenuToggle');
    const mobileNav = document.getElementById('mobileNav');
    const backdrop = document.getElementById('mobileMenuBackdrop');
    
    if (menuToggle && mobileNav && backdrop) {
        menuToggle.addEventListener('click', function() {
            const isOpen = mobileNav.classList.contains('active');
            
            if (isOpen) {
                closeMenu();
            } else {
                openMenu();
            }
        });
        
        backdrop.addEventListener('click', closeMenu);
        
        // Close menu when clicking on a link
        const menuItems = mobileNav.querySelectorAll('.mobile-menu-item');
        menuItems.forEach(item => {
            item.addEventListener('click', closeMenu);
        });
        
        // Close menu on escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && mobileNav.classList.contains('active')) {
                closeMenu();
            }
        });
        
        function openMenu() {
            mobileNav.classList.add('active');
            backdrop.classList.add('active');
            menuToggle.classList.add('active');
            menuToggle.setAttribute('aria-expanded', 'true');
            document.body.classList.add('mobile-menu-open');
            document.body.style.overflow = 'hidden';
        }
        
        function closeMenu() {
            mobileNav.classList.remove('active');
            backdrop.classList.remove('active');
            menuToggle.classList.remove('active');
            menuToggle.setAttribute('aria-expanded', 'false');
            document.body.classList.remove('mobile-menu-open');
            document.body.style.overflow = '';
        }
    }

    // V4 Theme & Typography Logic
    const html = document.documentElement;
    const themeBtn = document.getElementById('themeToggle');
    const typoBtn = document.getElementById('typoToggle');
    
    if (themeBtn) {
        themeBtn.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            
            // Toggle Icons
            themeBtn.querySelector('.sun-icon').style.display = newTheme === 'light' ? 'block' : 'none';
            themeBtn.querySelector('.moon-icon').style.display = newTheme === 'dark' ? 'block' : 'none';
        });
    }
    
    if (typoBtn) {
        const typoLabel = document.getElementById('typoLabel');
        typoBtn.addEventListener('click', () => {
            const current = html.getAttribute('data-typography');
            const next = current === 'editorial' ? 'classic' : 'editorial';
            html.setAttribute('data-typography', next);
            if (typoLabel) {
                typoLabel.textContent = next === 'editorial' ? 'm' : 'c';
            }
        });
    }
})();
</script>
