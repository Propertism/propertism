<!-- Primary Meta Tags -->
<meta name="title" content="{{ title }}">
<meta name="description" content="{{ description }}">
{% if keywords %}<meta name="keywords" content="{{ keywords }}">{% endif %}

<!-- Canonical URL -->
<link rel="canonical" href="{{ canonical_url }}">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="{{ page_type }}">
<meta property="og:url" content="{{ canonical_url }}">
<meta property="og:title" content="{{ social_title }}">
<meta property="og:description" content="{{ social_description }}">
<meta property="og:image" content="{{ image }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:alt" content="Propertism Realty Advisors brand card for NRI property advisory in Chennai.">
<meta property="og:site_name" content="{{ site_name }}">
<meta property="og:locale" content="en_US">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="{{ canonical_url }}">
<meta name="twitter:title" content="{{ social_title }}">
<meta name="twitter:description" content="{{ social_description }}">
<meta name="twitter:image" content="{{ image }}">
<meta name="twitter:image:alt" content="Propertism Realty Advisors brand card for NRI property advisory in Chennai.">
{% if twitter_handle %}<meta name="twitter:site" content="{{ twitter_handle }}">{% endif %}

<!-- Additional SEO -->
<meta name="robots" content="index, follow">
<meta name="language" content="English">
<meta name="revisit-after" content="7 days">
<meta name="author" content="{{ site_name }}">
