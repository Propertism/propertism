name: Deploy to Lightsail Mumbai

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Lightsail Mumbai
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Deploying latest code to /var/www/propertism..."
            cd /var/www/propertism
            git fetch origin main
            git reset --hard origin/main
            ./venv/bin/pip install -r requirements.txt
            ./venv/bin/python manage.py migrate --noinput
            ./venv/bin/python manage.py collectstatic --noinput
            if [ -d "/var/www/propertism_media" ]; then
              echo "🔄 Syncing repository media assets to persistent media storage..."
              mkdir -p /var/www/propertism_media/properties
              cp -u -r media/* /var/www/propertism_media/ 2>/dev/null || true
              sudo chown -R www-data:www-data /var/www/propertism_media/
            fi
            sudo systemctl restart gunicorn
            echo "✅ Deployment completed successfully!"
