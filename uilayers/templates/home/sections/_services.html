{% load static %}
<!-- SERVICES SECTION V4 - NRI SPECIALIZATION -->
<link rel="stylesheet" href="{% static 'css/v4-services.css' %}">

<section id="services-section" class="section-full">
    <div class="section-inner">
        <div class="section-header">
            <span class="section-kicker">
                <svg class="section-kicker-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="m9 12 2 2 4-4"/>
                </svg>
                SERVICES
            </span>
            <h2 class="section-title">Services built for NRI ownership</h2>
            <p class="section-subtitle">
                Buy, rent, maintain, and monitor property with one coordinated team in Chennai.
            </p>
        </div>

        <div class="grid-3">
            {% for service in service_highlights %}
            <div class="insight-card hf-service-card">
                <div class="insight-icon">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-9.5Z" />
                        <path d="M9 21V12h6v9" />
                    </svg>
                </div>
                <h3 class="insight-title">{{ service.title }}</h3>
                <p class="insight-description">{{ service.short_description|truncatewords:20 }}</p>
                <a href="{{ home_section_links.contact }}" class="service-depth-link">
                    Discuss This Plan
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left: 8px;">
                        <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
