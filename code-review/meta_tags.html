<!-- Primary Meta Tags -->
<meta name="title" content="{{ title }}">
<meta name="description" content="{{ description }}">
{% if keywords %}<meta name="keywords" content="{{ keywords }}">{% endif %}

<!-- Canonical URL -->
<link rel="canonical" href="{{ canonical_url }}">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="{{ page_type }}">
<meta property="og:url" content="{{ url }}">
<meta property="og:title" content="propertism.in">
<meta property="og:description" content="Propertism Realty Advisors — Expert NRI property advisory in Chennai. Buy, sell, and manage your Chennai real estate with trusted on-ground advisors.">
<meta property="og:image" content="{{ image }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta property="og:site_name" content="{{ site_name }}">
<meta property="og:locale" content="en_US">

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="{{ url }}">
<meta property="twitter:title" content="propertism.in">
<meta property="twitter:description" content="Propertism Realty Advisors — Expert NRI property advisory in Chennai. Buy, sell, and manage your Chennai real estate with trusted on-ground advisors.">
<meta property="twitter:image" content="{{ image }}">
{% if twitter_handle %}<meta property="twitter:site" content="{{ twitter_handle }}">{% endif %}

<!-- Additional SEO -->
<meta name="robots" content="index, follow">
<meta name="language" content="English">
<meta name="revisit-after" content="7 days">
<meta name="author" content="{{ site_name }}">
