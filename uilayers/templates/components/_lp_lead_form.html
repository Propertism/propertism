<section id="landing-lead-form" class="lp-lead-form-section" hidden>
    <div class="container">
        <div class="lead-form-shell">
            <div class="lead-form-copy">
                <span class="lead-form-kicker">Property Lead Capture</span>
                <h2>{{ lead_form_title }}</h2>
                <p>{{ lead_form_intro }}</p>
            </div>

            <div class="lead-form-card">
                <div class="lead-form-progress" aria-hidden="true">
                    <span class="lead-progress-step is-active" data-step-indicator="1">1</span>
                    <span class="lead-progress-line"></span>
                    <span class="lead-progress-step" data-step-indicator="2">2</span>
                </div>

                <form id="landing-lead-form-element" class="lead-capture-form" data-endpoint="{% url 'landing_lead_api' %}" novalidate>
                    {% csrf_token %}
                    <input type="hidden" name="intent_type" value="{{ config.intent_type }}">
                    <input type="hidden" name="geo_origin" value="{{ nri_origin|default:'' }}">

                    <div class="lead-form-feedback" data-feedback hidden></div>

                    <div class="lead-form-step" data-step="1">
                        <div class="lead-field">
                            <label for="lead-phone">Phone Number</label>
                            <input id="lead-phone" type="tel" name="phone" inputmode="tel" autocomplete="tel" placeholder="+91 98XXXXXXXX" required>
                            <small data-error-for="phone"></small>
                        </div>

                        <div class="lead-field">
                            <label for="lead-city">Property City</label>
                            <input id="lead-city" type="text" name="property_city" value="{{ city.name }}" required>
                            <small data-error-for="property_city"></small>
                        </div>

                        <div class="lead-field-actions">
                            <button type="button" class="btn-primary js-lead-next">Continue</button>
                        </div>
                    </div>

                    <div class="lead-form-step" data-step="2" hidden>
                        <div class="lead-field-grid">
                            <div class="lead-field">
                                <label for="lead-name">Name</label>
                                <input id="lead-name" type="text" name="name" autocomplete="name" placeholder="Your name">
                            </div>

                            <div class="lead-field">
                                <label for="lead-email">Email</label>
                                <input id="lead-email" type="email" name="email" autocomplete="email" placeholder="Optional">
                            </div>
                        </div>

                        <div class="lead-intent-fields" data-intent-fields="sell" hidden>
                            <div class="lead-field">
                                <label for="lead-property-type">Property Type</label>
                                <select id="lead-property-type" name="property_type">
                                    <option value="">Select property type</option>
                                    {% for value, label in lead_property_type_choices %}
                                    <option value="{{ value }}">{{ label }}</option>
                                    {% endfor %}
                                </select>
                                <small data-error-for="property_type"></small>
                            </div>

                            <div class="lead-field">
                                <label for="lead-selling-timeline">Selling Timeline</label>
                                <select id="lead-selling-timeline" name="selling_timeline">
                                    <option value="">Select timeline</option>
                                    <option value="immediate">Immediate</option>
                                    <option value="30-days">Within 30 days</option>
                                    <option value="90-days">Within 90 days</option>
                                    <option value="researching">Just exploring options</option>
                                </select>
                                <small data-error-for="selling_timeline"></small>
                            </div>
                        </div>

                        <div class="lead-intent-fields" data-intent-fields="management" hidden>
                            <div class="lead-field">
                                <label for="lead-occupancy-status">Property Status</label>
                                <select id="lead-occupancy-status" name="occupancy_status">
                                    <option value="">Select status</option>
                                    <option value="occupied">Occupied</option>
                                    <option value="vacant">Vacant</option>
                                </select>
                                <small data-error-for="occupancy_status"></small>
                            </div>
                        </div>

                        <div class="lead-intent-fields" data-intent-fields="rental" hidden>
                            <div class="lead-field">
                                <label for="lead-expected-rent">Expected Rent</label>
                                <input id="lead-expected-rent" type="text" name="expected_rent" placeholder="Optional">
                            </div>
                        </div>

                        <div class="lead-form-actions">
                            <button type="button" class="btn-secondary js-lead-back">Back</button>
                            <button type="submit" class="btn-primary js-lead-submit" data-default-label="{{ primary_cta_label }}">{{ primary_cta_label }}</button>
                        </div>
                    </div>

                    <div class="lead-form-step" data-step="followup" hidden>
                        <div class="lead-field">
                            <label for="lead-followup-price-range">Expected Price Range</label>
                            <input id="lead-followup-price-range" type="text" name="followup_price_range" placeholder="Optional">
                        </div>
                        <div class="lead-field">
                            <label for="lead-followup-contact-time">Preferred Contact Time</label>
                            <input id="lead-followup-contact-time" type="text" name="followup_contact_time" placeholder="Optional">
                        </div>
                        <div class="lead-form-actions">
                            <button type="button" class="btn-secondary js-lead-skip-followup">Skip</button>
                            <button type="button" class="btn-primary js-lead-followup-submit" data-default-label="Save Preferences">Save Preferences</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
