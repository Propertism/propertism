<!-- Conditional CAPTCHA -->
{% if show_captcha %}
<div class="captcha-container" style="background-color: rgba(255, 255, 255, 0.03); border: 1px solid rgba(196, 156, 82, 0.3); padding: 20px; margin-bottom: 24px; border-radius: 4px;">
    <div style="font-weight: 600; color: #C49C52; margin-bottom: 8px; font-family: 'Jost', sans-serif; font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase;">
        <span style="color: #C49C52; margin-right: 4px;">⚠</span> Additional Verification Required
    </div>
    <label for="captcha_answer" style="display: block; font-size: 0.95rem; color: #FFFFFF; margin-bottom: 12px; font-family: 'Jost', sans-serif; line-height: 1.4;">
        Please answer this simple math question to proceed: <br>
        <span style="font-weight: 700; color: #C49C52; font-size: 1.1rem; display: inline-block; margin-top: 6px;">What is {{ request.session.captcha_question }}?</span>
    </label>
    <input type="number" name="captcha_answer" id="captcha_answer" required 
           class="hf-field-input v4-input"
           style="width: 100%; max-width: 200px; padding: 12px; background-color: rgba(0, 0, 0, 0.2) !important; border: 1px solid rgba(255, 255, 255, 0.2) !important; color: #ffffff !important; border-radius: 4px;"
           placeholder="Enter answer">
</div>
{% endif %}
